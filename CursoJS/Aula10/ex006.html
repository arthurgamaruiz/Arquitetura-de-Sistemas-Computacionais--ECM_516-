<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            font: normal 20pt Arial;
            background: rgb(107, 216, 107);
            color:white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id = "area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>

    <script>
        let a = window.document.getElementById('area')
        //quando clicar, muda o texto da div
        function clicar(){
            
            a.innerText = 'Clicou';
        }
        //quando o cursor do mouse entrar na div
        function entrar(){
            a.innerText = 'Entrou na div'
        }
        //quando cursor sair da div
        function sair(){
            a.innerText = 'Saiu da div'
        }
    </script>
</body>
</html>
